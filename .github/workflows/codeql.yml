name: CodeQL

# Prose-only commits have nothing for CodeQL to analyze and used to trigger a
# ~100s scan anyway. Deliberately NOT the same list as CI: CI skips website/**
# because the npm package build does not cover it, but the website is an Astro
# app with ~37 JS/TS files and this scan is javascript-typescript, so excluding
# it here would drop real code out of per-push analysis.
on:
  push:
    branches: [main]
    paths-ignore: &prose-only
      - 'docs/**'
      - '**.md'
      - 'llms.txt'
  pull_request:
    branches: [main]
    paths-ignore: *prose-only
  schedule:
    - cron: '15 3 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
