name: CodeQL

# Same paths-ignore as CI: a README or website commit has no code for CodeQL to
# analyze, and used to trigger a ~100s scan anyway. The weekly cron still scans
# the whole tree regardless of what the last commit touched.
on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - 'website/**'
      - 'docs/**'
      - '**.md'
      - 'llms.txt'
  pull_request:
    branches: [main]
    paths-ignore: *docs-only
  schedule:
    - cron: '15 3 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
