name: OpenSSF Scorecard

# Scorecard grades repository configuration — branch protection, pinned actions,
# signed releases, workflow permissions — not the contents of a commit. Running
# it per push re-scored an unchanged repo and cost a third workflow every time.
# The weekly cron plus the branch_protection_rule event cover every input it
# actually reads. Run it on demand after changing repo settings.
on:
  branch_protection_rule:
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # The default GITHUB_TOKEN cannot read classic branch protection, so
          # the Branch-Protection check errors out instead of scoring. A
          # fine-grained PAT with Administration:read fixes it. Optional: the
          # run still succeeds without the secret, that check just stays -1.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif
