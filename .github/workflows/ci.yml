name: CI

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
      - 'llms.txt'
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
      - 'llms.txt'

permissions:
  contents: read

# Pushing three times in a minute used to leave three full runs racing. Only the
# newest ref matters, so supersede the older ones instead of paying for them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  ci:
    name: Build, Lint, Typecheck, Test
    runs-on: ubuntu-latest
    # The whole job is well under two minutes; without a cap a hung test burns
    # the six-hour runner maximum before anyone sees a red X.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      - name: Build
        run: pnpm build

      - name: Verify build outputs
        run: |
          test -f dist/cli/index.js
          test -f dist/server/index.js
          test -f dist/types.js

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # One run, not two. `pnpm test` followed by `pnpm coverage` executed the
      # whole suite twice; coverage is the same run with instrumentation on.
      - name: Test + coverage
        run: pnpm coverage
        env:
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build image
        run: docker build -t infrawise:ci .

      - name: Smoke test stdio transport
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run --rm -i infrawise:ci > out.jsonl
          grep -q '"serverInfo"' out.jsonl
          test "$(grep -o '"name":"get_' out.jsonl | wc -l)" -ge 15
